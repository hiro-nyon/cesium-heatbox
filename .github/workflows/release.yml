name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-cesium-heatbox
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cesium-heatbox
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release identity and branch lane
        id: meta
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")
          SOURCE_VERSION=$(node -e "const fs=require('fs'); const source=fs.readFileSync('src/index.js','utf8'); const match=source.match(/export const VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); if (!match) process.exit(1); process.stdout.write(match[1]);")
          EXPECTED_TAG="v${VERSION}"

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag/package mismatch: tag=$TAG_NAME package=$VERSION" >&2
            exit 1
          fi

          if [ "$LOCK_VERSION" != "$VERSION" ] || [ "$LOCK_ROOT_VERSION" != "$VERSION" ]; then
            echo "package-lock.json version does not match package.json: package=$VERSION lock=$LOCK_VERSION lock-root=$LOCK_ROOT_VERSION" >&2
            exit 1
          fi

          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "src/index.js VERSION does not match package.json: package=$VERSION source=$SOURCE_VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/next:refs/remotes/origin/next

          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG_NAME")
          MAIN_COMMIT=$(git rev-parse refs/remotes/origin/main)
          NEXT_COMMIT=$(git rev-parse refs/remotes/origin/next)

          if [[ "$VERSION" == *-* ]]; then
            case "$VERSION" in
              *-alpha.*|*-beta.*|*-rc.*) ;;
              *)
                echo "Unsupported prerelease identifier: $VERSION" >&2
                exit 1
                ;;
            esac

            if [ "$TAG_COMMIT" != "$NEXT_COMMIT" ]; then
              echo "Prerelease tags must point to the current next head: tag=$TAG_COMMIT next=$NEXT_COMMIT" >&2
              exit 1
            fi
            CHANNEL=next
            IS_PRERELEASE=true
          else
            if [ "$MAIN_COMMIT" != "$NEXT_COMMIT" ]; then
              echo "Stable release requires main and next to point to the same commit: main=$MAIN_COMMIT next=$NEXT_COMMIT" >&2
              exit 1
            fi
            if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
              echo "Stable tags must point to the current main head: tag=$TAG_COMMIT main=$MAIN_COMMIT" >&2
              exit 1
            fi
            CHANNEL=latest
            IS_PRERELEASE=false
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG_NAME"
            echo "channel=$CHANNEL"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install --global "npm@^11.15.0"
          npm --version

      - name: Reject an already published version
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSIONS=$(npm view "$PACKAGE_NAME" versions --json)
          if node -e "const versions=JSON.parse(process.argv[1]); const list=Array.isArray(versions) ? versions : [versions]; process.exit(list.includes(process.argv[2]) ? 0 : 1);" "$PUBLISHED_VERSIONS" "$VERSION"; then
            echo "$PACKAGE_NAME@$VERSION is already published and cannot be reused." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build all formats
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Dry run package contents
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          echo "Publishing version $VERSION to @$CHANNEL"
          if [ "$CHANNEL" = "next" ]; then
            npm publish --provenance --tag next
          else
            npm publish --provenance
          fi

      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        with:
          result-encoding: string
          script: |
            const tag = process.env.RELEASE_TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const notes = await github.rest.repos.generateReleaseNotes({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha
              });
              core.setOutput('body', notes.data.body || '');
              core.setOutput('name', notes.data.name || tag);
            } catch (error) {
              core.warning(`Failed to generate release notes: ${error.message}`);
              core.setOutput('body', '');
              core.setOutput('name', tag);
            }

      - name: Create or update GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.release_notes.outputs.body }}
          RELEASE_NAME: ${{ steps.release_notes.outputs.name }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const name = process.env.RELEASE_NAME || tag;
            const body = process.env.RELEASE_BODY || '';
            const prerelease = process.env.IS_PRERELEASE === 'true';

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: tag,
                name,
                body,
                draft: false,
                prerelease
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name,
                  body,
                  draft: false,
                  prerelease
                });
              } else {
                throw error;
              }
            }

      - name: Generate docs and sync wiki (stable only)
        if: ${{ steps.meta.outputs.is_prerelease == 'false' }}
        run: |
          npm run docs
          npm run wiki:sync

      - name: Publish Wiki (stable only)
        if: ${{ steps.meta.outputs.is_prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: bash tools/wiki/publish-wiki.sh "$OWNER" "$REPO"
