# GitHub Wiki 自動同期 Workflow
# トリガー: 公開ドキュメントや API 生成元の変更時、または手動実行

name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'wiki/**'
      - 'tools/wiki-sync.js'
      - 'tools/wiki/publish-wiki.sh'
      - 'jsdoc.config.json'
      - 'package.json'
      - 'README.md'
      - 'README.ja.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even without changes'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  wiki-sync:
    runs-on: ubuntu-latest
    if: github.repository == 'hiro-nyon/cesium-heatbox'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate docs if needed
      run: |
        if [ -f "jsdoc.config.json" ]; then
          npm run docs
        fi
    
    - name: Sync wiki content
      run: |
        npm run wiki:sync
    
    - name: Publish Wiki mirror
      env:
        WIKI_TOKEN: ${{ secrets.WIKI_TOKEN != '' && secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
      run: bash tools/wiki/publish-wiki.sh hiro-nyon cesium-heatbox
        
    - name: Notify success
      if: ${{ success() }}
      run: |
        echo "✅ Wiki sync completed successfully"
        echo "Check: https://github.com/hiro-nyon/cesium-heatbox/wiki"
        
    - name: Notify failure
      if: ${{ failure() }}
      run: |
        echo "❌ Wiki sync failed"
        echo "Manual intervention may be required"
        echo "Fallback: run 'npm run wiki:publish' locally"
