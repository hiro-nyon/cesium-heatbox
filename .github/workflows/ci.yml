name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify documentation sources and generated Wiki copies
        run: |
          npm run test:docs
          npm run docs
          npm run wiki:sync
          git diff --exit-code -- wiki

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  cesium-compat-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cesium-version: ['1.120.0', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install minimum Cesium compatibility snapshot
        if: ${{ matrix.cesium-version == '1.120.0' }}
        run: npm install --no-save --package-lock=false cesium@1.120.0 @cesium/engine@10.1.0 @cesium/widgets@7.1.0 @zip.js/zip.js@2.7.34

      - name: Install latest Cesium compatibility target
        if: ${{ matrix.cesium-version == 'latest' }}
        run: npm install --no-save --package-lock=false cesium@latest

      - name: Smoke test
        run: npm test --silent -- --runTestsByPath test/Heatbox.test.js test/core/VoxelRenderer.test.js test/core/geometry/GeometryRenderer.test.js test/integration/sample-code-validation.test.js --bail=1

      - name: Smoke build
        run: npm run build
